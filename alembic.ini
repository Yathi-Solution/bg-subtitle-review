# Alembic: versioned schema migrations for the Neon database (YouTube dashboard).
#
#   alembic upgrade head      apply all migrations (deploy step, before restarting the app)
#   alembic current           show the revision the database is at
#   alembic downgrade -1      undo the latest migration
#
# The connection string is read from DATABASE_URL_UNPOOLED (Neon's direct host,
# without "-pooler") in migrations/env.py — never stored in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
